<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operasional · Kelana</title>
<style>
:root {
  --bg:#ffffff; --side:#f7f7f5; --side-ink:#5f5e5b; --side-hover:#ebebea; --side-on:#e3e2e0;
  --ink:#37352f; --muted:#787774; --faint:#a5a29c; --line:#e9e9e7; --hover:#f1f1ef; --blue:#2383e2; --blue-bg:#e7f3f8;
  --t-gray:#ebebea; --t-brown:#eee0da; --t-orange:#fadec9; --t-yellow:#fdecc8; --t-green:#dbeddb; --t-blue:#d3e5ef; --t-purple:#e8deee; --t-pink:#f5e0e9; --t-red:#ffe2dd;
  --t-ink:#32302c; --me:#f1f8ff; --shadow:0 0 0 1px rgb(15 15 15 / .05), 0 3px 6px rgb(15 15 15 / .1), 0 9px 24px rgb(15 15 15 / .2);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#191919; --side:#202020; --side-ink:#9b9b9b; --side-hover:#2c2c2c; --side-on:#333333;
    --ink:#e6e6e5; --muted:#9b9b9b; --faint:#6f6f6f; --line:#2f2f2f; --hover:#252525; --blue:#529cca; --blue-bg:#1f2d38;
    --t-gray:#373737; --t-brown:#4a3a32; --t-orange:#5c3b23; --t-yellow:#564328; --t-green:#2b4632; --t-blue:#28456c; --t-purple:#3f2f50; --t-pink:#4e2c3c; --t-red:#5a2a2a;
    --t-ink:#e6e6e5; --me:#1d2731; --shadow:0 0 0 1px rgb(255 255 255 / .08), 0 6px 24px rgb(0 0 0 / .5);
  }
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:inherit; }
button { font:inherit; color:inherit; }
.app { display:grid; grid-template-columns:240px 1fr; height:100vh; }

/* ---- sidebar */
.side { background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.ws { display:flex; align-items:center; gap:8px; padding:12px 12px 10px; font-weight:600; }
.ws .logo { width:22px; height:22px; border-radius:5px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-size:12px; }
.ws small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
.snav { overflow-y:auto; flex:1; padding:0 6px 10px; }
.sh { font-size:12px; font-weight:600; color:var(--faint); padding:14px 8px 4px; }
.si { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; text-align:left; padding:4px 8px; border-radius:6px; color:var(--side-ink); cursor:pointer; min-height:28px; text-decoration:none; }
.si:hover { background:var(--side-hover); }
.si[aria-current="true"] { background:var(--side-on); color:var(--ink); font-weight:600; }
.si .ic { width:18px; text-align:center; flex:0 0 18px; color:var(--faint); }
.si .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.si .ct { font-size:11px; background:#eb5757; color:#fff; border-radius:9px; padding:0 6px; font-weight:600; }
.si.unread .nm { color:var(--ink); font-weight:600; }
.sfoot { border-top:1px solid var(--line); padding:6px; }
.btn.burger { display:none; }
@media (max-width: 800px) {
  .app { grid-template-columns:1fr; }
  .side { position:fixed; inset:0 auto 0 0; width:260px; z-index:30; transform:translateX(-100%); transition:transform .18s; }
  .app.nav .side { transform:none; box-shadow:var(--shadow); }
  .btn.burger { display:inline-flex; }
}

/* ---- konten ala halaman Notion */
.main { overflow-y:auto; min-width:0; }
.top { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center; gap:8px; padding:8px 16px; font-size:13px; color:var(--muted); min-height:44px; }
.top .crumb { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page { max-width:1040px; margin:0 auto; padding:24px 48px 80px; }
@media (max-width: 800px) { .page { padding:12px 16px 60px; } }
h1.ttl { font-size:32px; line-height:1.2; font-weight:700; margin:12px 0 4px; letter-spacing:-.01em; }
.sub { color:var(--muted); margin:0 0 24px; }
h2.h { font-size:15px; font-weight:600; margin:32px 0 6px; padding-bottom:6px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
h2.h .n { color:var(--faint); font-weight:400; }
.muted { color:var(--muted); } .faint { color:var(--faint); } .small { font-size:12.5px; }
.empty { color:var(--faint); padding:10px 2px; }

/* statistik baris teks */
.facts { display:flex; flex-wrap:wrap; gap:4px 28px; padding:4px 0 2px; }
.fact { display:flex; align-items:baseline; gap:6px; }
.fact b { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
.fact span { color:var(--muted); font-size:13px; }
.fact.alert b { color:#eb5757; }

/* tabel database */
.db { width:100%; border-collapse:collapse; font-size:13.5px; }
.tw { overflow-x:auto; }
.db th { text-align:left; font-weight:400; color:var(--muted); font-size:12.5px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.db td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.db tr.rowlink { cursor:pointer; } .db tr.rowlink:hover td { background:var(--hover); }
.db td.n, .db th.n { text-align:right; font-variant-numeric:tabular-nums; }
.db .tt { font-weight:500; }
.id { color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }

/* tag & progres */
.tag { display:inline-block; font-size:12px; line-height:20px; padding:0 6px; border-radius:3px; background:var(--t-gray); color:var(--t-ink); white-space:nowrap; }
.tg-gray { background:var(--t-gray); } .tg-brown { background:var(--t-brown); } .tg-orange { background:var(--t-orange); } .tg-yellow { background:var(--t-yellow); }
.tg-green { background:var(--t-green); } .tg-blue { background:var(--t-blue); } .tg-purple { background:var(--t-purple); } .tg-pink { background:var(--t-pink); } .tg-red { background:var(--t-red); }
.prog { display:flex; align-items:center; gap:8px; min-width:110px; }
.prog .b { flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; } .prog .b i { display:block; height:100%; background:var(--blue); }
.prog span { font-size:12px; color:var(--muted); width:32px; text-align:right; font-variant-numeric:tabular-nums; }

/* tombol & input */
.btn { border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { background:var(--hover); }
.btn.pri { background:var(--blue); border-color:var(--blue); color:#fff; } .btn.pri:hover { filter:brightness(1.07); }
.btn.ok { background:#448361; border-color:#448361; color:#fff; } .btn.no { color:#eb5757; }
.btn.ghost { border-color:transparent; color:var(--muted); } .btn.ghost:hover { color:var(--ink); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
input, select, textarea { font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; max-width:100%; }
input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset:-1px; border-color:var(--blue); }
textarea { width:100%; resize:vertical; }
:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }

/* properti (form & detail) */
.props { display:grid; grid-template-columns:150px 1fr; gap:2px 12px; margin:8px 0 16px; align-items:center; }
.props > .k { color:var(--muted); font-size:13.5px; padding:5px 0; display:flex; gap:8px; align-items:center; }
.props > .v { padding:3px 0; min-width:0; }
.props > .v > input, .props > .v > select { width:100%; border-color:transparent; background:transparent; }
.props > .v > input:hover, .props > .v > select:hover { background:var(--hover); }
@media (max-width: 560px) { .props { grid-template-columns:110px 1fr; } }
.field { margin:12px 0; } .field > span { display:block; color:var(--muted); font-size:12.5px; margin-bottom:4px; }
.prose { white-space:pre-wrap; overflow-wrap:anywhere; }
.callout { display:flex; gap:10px; background:var(--hover); border-radius:6px; padding:12px 14px; margin:10px 0; }
.chk { display:flex; gap:8px; align-items:center; padding:3px 0; cursor:pointer; }
.chk input { width:16px; height:16px; accent-color:var(--blue); }

/* board */
.board { display:flex; gap:12px; overflow-x:auto; padding:4px 0 16px; align-items:flex-start; }
.lane { flex:0 0 250px; }
.lane-h { display:flex; align-items:center; gap:6px; font-size:13px; padding:4px 2px 8px; }
.lane-h .c { color:var(--faint); }
.kcard { display:block; width:100%; text-align:left; background:var(--bg); border:0; border-radius:6px; box-shadow:0 0 0 1px var(--line), 0 1px 2px rgb(15 15 15 / .06); padding:9px 10px; margin-bottom:8px; cursor:pointer; }
.kcard:hover { background:var(--hover); }
.kcard .tt { font-weight:500; display:block; margin-bottom:6px; }
.kcard .meta { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; font-size:12px; color:var(--muted); }
.lane.empty-lane .lane-h { color:var(--faint); }
.boardtools { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.boardtools label { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:13px; }

/* org */
.orgdiv { margin:10px 0 24px; }
.ppl { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:2px 16px; }
.pp { display:flex; gap:10px; align-items:center; padding:6px 6px; border-radius:6px; }
.pp:hover { background:var(--hover); }
.pp .t { flex:1; min-width:0; } .pp b { font-weight:500; display:block; }
.pp small { color:var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pp.off { opacity:.45; } .pp .btn { opacity:0; } .pp:hover .btn, .pp .btn:focus { opacity:1; }
.av { flex:0 0 32px; width:32px; height:32px; border-radius:6px; display:grid; place-items:center; color:#fff; font-weight:600; font-size:13px; }
.av.lg { flex-basis:36px; width:36px; height:36px; font-size:14px; }

/* ---- chat ala Slack */
.chat { display:flex; flex-direction:column; height:100vh; }
.chead { display:flex; align-items:center; gap:10px; padding:10px 20px; border-bottom:1px solid var(--line); min-height:52px; }
.chead b { font-size:16px; } .chead small { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cbody { flex:1; overflow-y:auto; padding:8px 0 12px; }
.daysep { display:flex; align-items:center; gap:10px; margin:14px 20px 6px; color:var(--muted); font-size:12px; font-weight:600; }
.daysep::before, .daysep::after { content:""; flex:1; height:1px; background:var(--line); }
.m { display:flex; gap:10px; padding:4px 20px; position:relative; }
.m:hover { background:var(--hover); }
.m .gut { flex:0 0 36px; }
.m .gut time { display:none; font-size:10.5px; color:var(--faint); padding-top:3px; text-align:right; width:36px; }
.m.cont .gut .av { display:none; } .m.cont:hover .gut time { display:block; }
.m .bd { min-width:0; flex:1; }
.m .nmr { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
.m .nmr b { font-weight:700; } .m .nmr .role { color:var(--muted); font-size:12px; } .m .nmr time { color:var(--faint); font-size:12px; }
.m .tx { white-space:pre-wrap; overflow-wrap:anywhere; }
.m .tx .mention { background:var(--blue-bg); color:var(--blue); border-radius:3px; padding:0 2px; text-decoration:none; cursor:pointer; }
.m .qt { border-left:3px solid var(--line); padding:0 0 0 8px; margin:2px 0 4px; color:var(--muted); font-size:13px; }
.m .qt b { color:var(--ink); font-weight:600; margin-right:4px; }
.m .stk { display:inline-flex; flex-direction:column; align-items:center; padding:4px 6px; }
.m .stk .e { font-size:72px; line-height:1.05; } .m .stk .c { font-size:12px; font-weight:600; color:var(--muted); }
.m .tools { position:absolute; right:20px; top:-12px; display:none; background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 3px rgb(0 0 0 / .08); }
.m:hover .tools, .m:focus-within .tools { display:flex; }
.m .tools button { border:0; background:none; padding:4px 8px; cursor:pointer; color:var(--muted); font-size:12.5px; }
.m .tools button:hover { background:var(--hover); color:var(--ink); }
.m.sys { padding-left:66px; color:var(--muted); font-size:13px; }
.m.sys .tx::before { content:"• "; color:var(--faint); }
.m.me .nmr b { color:var(--blue); }
.composer { margin:0 20px 16px; border:1px solid color-mix(in srgb, var(--muted) 45%, transparent); border-radius:8px; position:relative; }
.composer:focus-within { border-color:var(--muted); }
.composer .replying { display:flex; gap:8px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); }
.composer .replying[hidden] { display:none; }
.composer .replying span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.composer textarea { border:0; resize:none; padding:10px 12px 4px; min-height:42px; max-height:160px; background:transparent; }
.composer textarea:focus { outline:none; }
.ctool { display:flex; align-items:center; gap:2px; padding:4px 6px; }
.ctool .ib { border:0; background:none; border-radius:4px; padding:4px 6px; cursor:pointer; color:var(--muted); font-size:13px; }
.ctool .ib:hover { background:var(--hover); color:var(--ink); }
.ctool select { border:0; background:none; color:var(--muted); font-size:13px; padding:4px; }
.ctool .sp { flex:1; }
.picker { position:absolute; bottom:calc(100% + 6px); left:0; width:min(420px, 92vw); background:var(--bg); border-radius:8px; box-shadow:var(--shadow); padding:8px; display:grid; grid-template-columns:repeat(5, 1fr); gap:2px; z-index:6; }
.picker[hidden] { display:none; }
.picker button { border:0; background:none; border-radius:6px; padding:6px 2px; cursor:pointer; font-size:11px; color:var(--muted); }
.picker button:hover { background:var(--hover); color:var(--ink); }
.picker button span { display:block; font-size:28px; line-height:1.2; }
.hint { padding:0 20px 8px; font-size:11.5px; color:var(--faint); margin-top:-10px; }

/* activity feed */
.feed .m { padding-left:0; padding-right:0; } .feed .m:hover { background:none; }

/* side peek */
.peek { position:fixed; inset:0 0 0 auto; width:min(760px, 100vw); background:var(--bg); box-shadow:var(--shadow); z-index:20; display:flex; flex-direction:column; transform:translateX(105%); transition:transform .2s ease; }
.peek.open { transform:none; }
.peek-h { display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
.peek-h .sp { flex:1; }
.peek-b { overflow-y:auto; padding:8px 40px 60px; }
@media (max-width: 600px) { .peek-b { padding:8px 16px 60px; } }
.peek-b h1.ttl { font-size:28px; }
.scrim { position:fixed; inset:0; background:rgb(15 15 15 / .25); z-index:15; display:none; } .scrim.on { display:block; }
.stepper { display:flex; flex-wrap:wrap; gap:2px; font-size:12px; margin:4px 0 8px; }
.stepper span { padding:2px 6px; border-radius:3px; color:var(--faint); }
.stepper span.done { color:var(--muted); } .stepper span.on { background:var(--t-blue); color:var(--t-ink); font-weight:600; }
.hist { font-size:12.5px; color:var(--muted); }
.hist div { padding:3px 0; border-bottom:1px solid var(--line); }
details > summary { cursor:pointer; color:var(--muted); font-size:13.5px; padding:4px 0; }
details > summary:hover { color:var(--ink); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:0 16px; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:6px; font-size:13.5px; opacity:0; transition:.18s; pointer-events:none; z-index:40; }
.toast.show { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Navigasi">
    <div class="ws"><span class="logo">K</span><div>Kelana Photobooth<small id="who">Operasional</small></div></div>
    <nav class="snav" id="snav"></nav>
    <div class="sfoot">
      <a class="si" href="/kerja"><span class="ic">◫</span><span class="nm">Kantor 3D</span></a>
      <a class="si" href="/kerja/report"><span class="ic">☰</span><span class="nm">Report HRD</span></a>
      <a class="si" href="/kerja/brand"><span class="ic">◐</span><span class="nm">Brand Kit</span></a>
      <a class="si" href="/kerja/agen"><span class="ic">⚙</span><span class="nm">Kelola agent</span></a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<section class="peek" id="peek" aria-label="Detail task" aria-hidden="true"><div class="peek-h"><button class="btn ghost" id="peekClose" aria-label="Tutup">✕</button><span id="peekCrumb"></span><span class="sp"></span></div><div class="peek-b" id="peekBody"></div></section>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); };
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json', 'X-Kantor': '1' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Gagal (${r.status})`);
  return j;
}
let META = null, ORGC = null, ROOMS = [], view = 'command', room = 'company', replyTo = null, lastSeen = {};
try { lastSeen = JSON.parse(localStorage.getItem('ops-seen') || '{}'); } catch {}

// ---- tag warna ala Notion
const STATUS_TAG = { INBOX: 'gray', CLARIFICATION: 'yellow', 'READY TO PLAN': 'brown', PLANNING: 'brown', 'WAITING APPROVAL': 'orange', ASSIGNED: 'purple', 'IN PROGRESS': 'blue', BLOCKED: 'red', 'INTERNAL REVIEW': 'pink', 'DIVISION REVIEW': 'pink', REVISION: 'orange', 'CEO REVIEW': 'orange', APPROVED: 'green', COMPLETED: 'green', CANCELLED: 'gray', DONE: 'green', lolos: 'green', revisi: 'orange', ditolak: 'red', Done: 'green', 'In Progress': 'blue' };
const PRI_TAG = { P0: 'red', P1: 'orange', P2: 'blue', P3: 'gray' };
const tag = (s, c) => `<span class="tag tg-${c || STATUS_TAG[s] || 'gray'}">${esc(s)}</span>`;
const pri = (p) => tag(p, PRI_TAG[p]);
const prog = (v) => `<div class="prog"><div class="b"><i style="width:${v}%"></i></div><span>${v}%</span></div>`;
const pctTxt = (v) => (v == null ? '–' : `${v}%`);
const fmtT = (iso) => (iso ? new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '');
const fmtD = (iso) => (iso ? new Date(iso).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' }) : '');
const fmtDT = (iso) => (iso ? new Date(iso).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
const dl = (d) => (d ? new Date(`${d}T00:00`).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');

// ---- avatar: warna tetap per nama
const PAL = ['#c4554d', '#cc782f', '#c29343', '#548164', '#487ca5', '#8a67ab', '#b35488', '#7f6f63', '#2f7f8a', '#5b6bb8'];
const colorOf = (n) => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const initials = (n) => String(n || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const av = (n, cls = '') => `<span class="av ${cls}" style="background:${colorOf(n)}" aria-hidden="true">${esc(initials(n))}</span>`;

function people() {
  const out = [];
  if (!ORGC) return out;
  if (ORGC.hrd) out.push({ ...ORGC.hrd });
  for (const d of ORGC.divisions) {
    if (d.head) out.push({ ...d.head, div: d.name });
    d.members.forEach((m) => out.push({ ...m, div: d.name }));
    for (const s of d.subdivisions) {
      if (s.head) out.push({ ...s.head, div: d.name, sub: s.name });
      [...s.members, ...s.freelancers].forEach((m) => out.push({ ...m, div: d.name, sub: s.name }));
    }
  }
  return out;
}
const roleOf = (name) => { const p = people().find((x) => x.name === name); return p ? (p.agent || p.role) : ''; };

// ---- sidebar

const chName = (r) => (r.type === 'task' ? r.id.replace('task:', '').toLowerCase() : r.name.toLowerCase().replace(/ (division )?room$/, '').replace(/[^a-z0-9]+/g, '-'));

});
function go(v) { view = v; location.hash = v; render(); }
function openRoom(id) { room = id; replyTo = null; go('chat'); }
const topbar = (crumb, extra = '') => `<div class="top"><button class="btn ghost burger" data-burger aria-label="Menu">☰</button><span class="crumb">${crumb}</span>${extra}</div>`;
document.addEventListener('click', (e) => { if (e.target.closest('[data-burger]')) $('#app').classList.toggle('nav'); });

async function refreshRooms() {
  ROOMS = (await api('/kerja/api/ops/rooms')).rooms;
  const pending = (await api('/kerja/api/ops/tasks')).tasks.filter((t) => t.status === 'CEO REVIEW').length;
  renderSide(pending);
}
async function render() {
  const m = $('#main');
  try {
    await refreshRooms();
    if (view === 'chat') return renderChat(m);
    if (view === 'command') return renderCommand(m, await api('/kerja/api/ops/overview'));
    if (view === 'org') { ORGC = await api('/kerja/api/ops/org'); return renderOrg(m); }
    if (view === 'tasks') return renderTasks(m, (await api('/kerja/api/ops/tasks')).tasks);

}

// ---------- 3. Chat ala Slack
function linkify(s) { return esc(s).replace(/\bTASK-\d{3,6}\b/g, (t) => `<a class="mention" data-open="${t}">${t}</a>`).replace(/(^|\s)@([A-Za-z][\w]{1,30})/g, '$1<span class="mention">@$2</span>'); }
function msgHtml(x, cont = false, showRoom = false) {
  const me = x.from === META.ceo;
  const mood = x.mood && META.moods[x.mood] ? ` <span title="${esc(x.mood)}">${META.moods[x.mood]}</span>` : '';
  if (x.kind && x.kind !== 'chat' && !x.sticker) {
    return `<div class="m sys"><div class="bd"><div class="tx"><b style="color:var(--ink)">${esc(x.from)}</b> ${linkify(x.text)}${showRoom ? ` <span class="faint small">· ${esc(x.room)}</span>` : ''} <span class="faint small">${fmtT(x.at)}</span></div></div></div>`;
  }
  const st = x.sticker && META.stickers[x.sticker];
  const body = `${x.reply_to ? `<div class="qt"><b>${esc(x.reply_to.from)}</b>${esc(x.reply_to.text)}</div>` : ''}${st ? `<div class="stk"><span class="e">${st[0]}</span><span class="c">${esc(st[1])}</span></div>` : ''}${x.text ? `<div class="tx">${linkify(x.text)}</div>` : ''}`;
  return `<div class="m ${cont ? 'cont' : ''} ${me ? 'me' : ''}" data-id="${esc(x.id || '')}">
    <div class="gut">${av(x.from, 'lg')}<time>${fmtT(x.at)}</time></div>
    <div class="bd">${cont ? '' : `<div class="nmr"><b>${esc(x.from)}</b>${mood}<span class="role">${esc(x.role || roleOf(x.from))}</span><time>${fmtT(x.at)}</time>${showRoom ? `<span class="faint small">#${esc(x.room)}</span>` : ''}</div>`}${body}</div>
    ${x.id && !showRoom ? `<div class="tools"><button data-reply="${esc(x.id)}">↩ Balas</button></div>` : ''}</div>`;
}
function renderMessages(msgs) {
  let out = ''; let prev = null; let day = '';
  for (const x of msgs) {
    const d = x.at.slice(0, 10);
    if (d !== day) { day = d; out += `<div class="daysep">${fmtD(x.at)}</div>`; prev = null; }
    const cont = prev && prev.from === x.from && prev.kind === 'chat' && x.kind === 'chat' && !x.reply_to && (new Date(x.at) - new Date(prev.at)) < 5 * 60e3;
    out += msgHtml(x, cont);
    prev = x;
  }
  return out || '<p class="empty" style="padding:20px">Belum ada obrolan di sini. Mulai duluan, atau tunggu agent menyapa.</p>';
}
async function renderChat(m) {
  const r = ROOMS.find((x) => x.id === room) || ROOMS.find((x) => x.id === 'company');
  room = r.id;
  const members = r.type === 'subdivision' || r.type === 'division' ? people().filter((p) => r.type === 'division' ? p.div === r.name.replace(/ Division Room$/, '') : p.sub === r.name.replace(/ Room$/, '')).length : people().length;
  const desc = r.type === 'task' ? `Thread task · ${esc(r.status)}` : r.type === 'company' ? (r.id === 'ceo' ? 'CEO dan kepala divisi' : 'Semua orang di Kelana') : `${members} anggota`;
  m.innerHTML = `<div class="chat">
    <div class="chead"><button class="btn ghost burger" data-burger aria-label="Menu">☰</button><b># ${esc(chName(r))}</b><small>${desc}</small>${r.type === 'task' ? `<span class="sp" style="flex:1"></span><button class="btn" data-open="${r.id.replace('task:', '')}">Buka task</button>` : ''}</div>
    <div class="cbody" id="cbody" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="replying" id="replying" hidden><span id="replyTxt"></span><button type="button" class="btn ghost small" id="replyX">Batal</button></div>
      <textarea name="text" rows="1" placeholder="Kirim pesan ke #${esc(chName(r))}"></textarea>
      <div class="ctool">
        <button type="button" class="ib" id="stkBtn" title="Stiker">☺ Stiker</button>
        <select name="mood" aria-label="Mood"><option value="">Mood</option>${Object.entries(META.moods).map(([k, e]) => `<option value="${k}">${e} ${k}</option>`).join('')}</select>
        <span class="sp"></span><button class="btn pri">Kirim</button>
      </div>
      <div class="picker" id="picker" hidden>${Object.entries(META.stickers).map(([k, [e, c]]) => `<button type="button" data-stk="${k}"><span>${e}</span>${esc(c)}</button>`).join('')}</div>
    </form>
    <div class="hint">Enter untuk kirim · Shift+Enter baris baru · sebut TASK-001 untuk menautkan task</div></div>`;
  const f = $('#composer');
  const send = async (extra = {}) => {
    try {
      await api('/kerja/api/ops/chat', 'POST', { room, text: f.text.value, mood: f.mood.value, reply_to: replyTo?.id, ...extra });
      f.text.value = ''; f.mood.value = ''; setReply(null); $('#picker').hidden = true; await loadMsgs(true);
    } catch (err) { toast(err.message); }
  };
  const setReply = (x) => { replyTo = x; $('#replying').hidden = !x; if (x) { $('#replyTxt').textContent = `Membalas ${x.from}: ${x.text || 'stiker'}`; f.text.focus(); } };
  f.onsubmit = (e) => { e.preventDefault(); if (f.text.value.trim()) send(); };
  f.text.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
  f.text.oninput = () => { f.text.style.height = 'auto'; f.text.style.height = `${f.text.scrollHeight}px`; };
  $('#stkBtn').onclick = () => { $('#picker').hidden = !$('#picker').hidden; };
  $('#picker').onclick = (e) => { const b = e.target.closest('[data-stk]'); if (b) send({ sticker: b.dataset.stk, text: f.text.value }); };
  $('#replyX').onclick = () => setReply(null);
  let msgs = [];
  $('#cbody').onclick = (e) => { const b = e.target.closest('[data-reply]'); if (b) setReply(msgs.find((x) => x.id === b.dataset.reply)); };
  async function loadMsgs(force) {
    const j = await api(`/kerja/api/ops/chat?room=${encodeURIComponent(room)}`);
    if (!force && j.messages.length === msgs.length) return;
    const body = $('#cbody'); const atEnd = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
    msgs = j.messages; body.innerHTML = renderMessages(msgs);
    if (atEnd || force) body.scrollTop = body.scrollHeight;
    if (msgs.length) { lastSeen[room] = msgs[msgs.length - 1].at; try { localStorage.setItem('ops-seen', JSON.stringify(lastSeen)); } catch {} }
  }
  renderChat.poll = loadMsgs;
  await loadMsgs(true);
  f.text.focus();
}

// ---------- side peek
function openPeek(crumb, html) { $('#peekCrumb').textContent = crumb; $('#peekBody').innerHTML = html; $('#peek').classList.add('open'); $('#peek').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); }

$('#peekClose').onclick = closePeek; $('#scrim').onclick = closePeek;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#peek').classList.contains('open')) closePeek(); });

async function openTask(id) {
  const t = await api(`/kerja/api/ops/tasks/${id}`);
  const ppl = people().filter((p) => p.active !== false);
  const flow = ['INBOX', 'CLARIFICATION', 'PLANNING', 'ASSIGNED', 'IN PROGRESS', 'INTERNAL REVIEW', 'DIVISION REVIEW', 'CEO REVIEW', 'APPROVED', 'COMPLETED'];
  const at = flow.indexOf(t.status);
  const c = t.clarification;
  const stage = { 'INTERNAL REVIEW': 'sub', 'DIVISION REVIEW': 'div', 'CEO REVIEW': 'ceo' }[t.status];
  const txt = (k, x) => (x ? `<h2 class="h">${k}</h2><div class="prose">${esc(x)}</div>` : '');
  openPeek(`Tasks / ${t.id}`, `
  <h1 class="ttl">${esc(t.title)}</h1>
  <div class="stepper">${flow.map((s, i) => `<span class="${s === t.status ? 'on' : i < at ? 'done' : ''}">${s.toLowerCase()}</span>`).join('<span class="faint">›</span>')}</div>
  <div class="props">
    <div class="k">◉ Status</div><div class="v">${tag(t.status)}${t.overdue ? ` ${tag('Terlambat', 'red')}` : ''}</div>
    <div class="k">⚑ Prioritas</div><div class="v">${pri(t.priority)}</div>
    <div class="k">◔ PIC</div><div class="v">${esc(t.pic || '—')}</div>
    <div class="k">◎ Divisi</div><div class="v">${esc(t.division || '—')}${t.subdivision ? ` / ${esc(t.subdivision)}` : ''}</div>
    <div class="k">◷ Deadline</div><div class="v">${dl(t.deadline)}</div>
    <div class="k">↗ Progres</div><div class="v">${prog(t.progress)}</div>
    <div class="k">✎ Requester</div><div class="v">${esc(t.requester)} · <span class="muted small">${fmtDT(t.created)}</span></div>
  </div>
  ${stage === 'ceo' ? '<div class="callout"><span>⏳</span><div>Task ini menunggu keputusan Anda. Lihat bagian <b>CEO Review</b> di bawah.</div></div>' : ''}
  ${txt('Instruksi', t.description)}${txt('Tujuan', t.objective)}${txt('Ruang lingkup', t.scope)}${txt('Deliverables', t.deliverables)}${txt('Acceptance criteria', t.acceptance)}${txt('Hasil akhir', t.result)}
  ${c ? `<h2 class="h">Klarifikasi</h2>${[['Tujuan yang dipahami', c.understood], ['Asumsi', c.assumptions], ['Pertanyaan untuk CEO', c.questions], ['Rekomendasi', c.recommendation], ['Jawaban CEO', c.answer]].filter(([, x]) => x).map(([k, x]) => `<p style="margin:6px 0"><span class="muted small">${k}</span><br><span class="prose">${esc(x)}</span></p>`).join('')}
    ${t.status === 'CLARIFICATION' ? `<form id="answer"><textarea name="answer" rows="3" required placeholder="Tulis jawaban Anda"></textarea><div class="row" style="margin-top:6px"><button class="btn pri">Kirim jawaban</button></div></form>` : ''}` : ''}
  <h2 class="h">Subtask <span class="n">${t.subtasks.length}</span></h2>
  ${t.subtasks.length ? `<div class="tw"><table class="db"><tr><th>Subtask</th><th>PIC</th><th>Status</th><th>Progres</th><th>Bobot</th><th>Output</th></tr>${t.subtasks.map((s) => `<tr><td><span class="id">#${s.no}</span> <span class="tt">${esc(s.title)}</span>${s.instruction ? `<div class="small muted prose">${esc(s.instruction)}</div>` : ''}<div class="small faint">${dl(s.deadline)}</div></td><td>${esc(s.agent)}</td><td>${tag(s.status)}${s.revisions ? ` <span class="small faint">rev ${s.revisions}</span>` : ''}</td><td>${prog(s.progress)}</td><td class="n">${s.weight}</td><td class="small prose">${esc(s.output || '')}</td></tr>`).join('')}</table></div>` : '<p class="empty">Belum didelegasikan.</p>'}
  <details><summary>+ Tambah subtask</summary><form id="addSub"><div class="grid2"><label class="field"><span>Subtask</span><input name="title" required style="width:100%"></label><label class="field"><span>PIC</span><select name="agent" style="width:100%">${ppl.map((p) => `<option value="${esc(p.name)}" data-type="${esc(p.agent || '')}">${esc(p.name)} — ${esc(p.agent || p.role)}</option>`).join('')}</select></label><label class="field"><span>Deadline</span><input type="date" name="deadline" style="width:100%"></label><label class="field"><span>Bobot (%)</span><input type="number" name="weight" min="0" max="100" value="20" style="width:100%"></label></div><label class="field"><span>Instruksi</span><textarea name="instruction" rows="2"></textarea></label><button class="btn pri">Delegasikan</button></form></details>
  ${stage ? `<h2 class="h">${META.stages[stage]}</h2><form id="rev">${META.checklists[stage].map((x) => `<label class="chk"><input type="checkbox" name="checked" value="${esc(x)}">${esc(x)}</label>`).join('')}
    <label class="field"><span>Catatan / instruksi perbaikan</span><textarea name="note" rows="2"></textarea></label><div class="grid2"><label class="field"><span>Penyebab (bila revisi)</span><input name="cause" style="width:100%"></label><label class="field"><span>Subtask yang direvisi (no, pisah koma)</span><input name="subtasks" style="width:100%"></label></div>
    <div class="row"><button class="btn ok" name="r" value="lolos">Setujui</button><button class="btn" name="r" value="revisi">Minta revisi</button>${stage === 'ceo' ? '<button class="btn no" name="r" value="ditolak">Tolak</button>' : ''}</div>
    ${stage !== 'ceo' ? '<p class="small muted">Tahap ini biasanya diisi kepala sub divisi / kepala divisi. Anda tetap bisa mengisinya.</p>' : ''}</form>` : ''}
  <h2 class="h">Tindakan</h2><div class="row">
    ${t.subtasks.length && ['ASSIGNED', 'IN PROGRESS'].includes(t.status) ? '<button class="btn" data-act="submit">Serahkan ke Subdivision Review</button>' : ''}
    ${t.status === 'REVISION' ? '<button class="btn" data-act="resolve">Revisi selesai</button>' : ''}
    ${t.status === 'APPROVED' ? '<button class="btn ok" data-act="complete">Tandai selesai</button>' : ''}
    <button class="btn" data-chat="task:${t.id}"># Buka thread</button>
  </div>
  <details style="margin-top:8px"><summary>Ubah status, prioritas, atau deadline</summary><div class="row" style="margin-top:6px">
    <select id="stSel">${Object.keys(META.statuses).filter((s) => s === t.status || !['APPROVED', 'DIVISION REVIEW', 'CEO REVIEW', 'INTERNAL REVIEW'].includes(s)).map((s) => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select><button class="btn" data-act="status">Simpan status</button>
    <select id="prSel">${Object.keys(META.priorities).map((p) => `<option ${p === t.priority ? 'selected' : ''}>${p}</option>`).join('')}</select><input type="date" id="dlSel" value="${t.deadline}"><button class="btn" data-act="plan">Simpan rencana</button></div></details>
  ${t.reviews.length ? `<h2 class="h">Riwayat review</h2><table class="db"><tr><th>Tahap</th><th>Reviewer</th><th>Hasil</th><th>Catatan</th><th>Waktu</th></tr>${t.reviews.map((r) => `<tr><td>${META.stages[r.stage]}</td><td>${esc(r.reviewer)}</td><td>${tag(r.result)}</td><td class="small prose">${esc(r.note)}</td><td class="small muted">${fmtDT(r.at)}</td></tr>`).join('')}</table>` : ''}
  ${t.revisions.length ? `<h2 class="h">Revisi</h2><table class="db"><tr><th>No</th><th>Kesalahan</th><th>Penyebab</th><th>PIC</th><th>Status</th></tr>${t.revisions.map((r) => `<tr><td class="id">${r.id}</td><td class="small prose">${esc(r.problem)}</td><td class="small">${esc(r.cause)}</td><td>${esc(r.pic)}</td><td>${tag(r.status)}</td></tr>`).join('')}</table>` : ''}
  <h2 class="h">Riwayat</h2><div class="hist">${t.history.slice().reverse().map((h) => `<div><span class="faint">${fmtDT(h.at)}</span> · <b style="color:var(--ink);font-weight:500">${esc(h.by)}</b> ${esc(h.action)}${h.note ? ` — ${esc(h.note)}` : ''}</div>`).join('')}</div>`);
  const b = $('#peekBody');
  const run = async (fn, msg) => { try { await fn(); toast(msg); await openTask(id); render(); } catch (err) { toast(err.message); } };
  const ans = $('#answer', b);
  if (ans) ans.onsubmit = (e) => { e.preventDefault(); run(() => api(`/kerja/api/ops/tasks/${id}`, 'PUT', { clarification: { ...c, answer: ans.answer.value }, status: 'READY TO PLAN' }), 'Jawaban dikirim'); };
  $('#addSub', b).onsubmit = (e) => { e.preventDefault(); const f = e.target; const o = Object.fromEntries(new FormData(f)); o.agent_type = f.agent.selectedOptions[0]?.dataset.type; run(() => api(`/kerja/api/ops/tasks/${id}/subtasks`, 'POST', o), 'Subtask didelegasikan'); };
  b.querySelectorAll('[data-act]').forEach((x) => { x.onclick = () => {
    const a = x.dataset.act;
    if (a === 'submit') return run(() => api(`/kerja/api/ops/tasks/${id}/submit`, 'POST', {}), 'Diserahkan untuk review');
    if (a === 'resolve') return run(() => api(`/kerja/api/ops/tasks/${id}/resolve`, 'POST', {}), 'Kembali ke review');
    if (a === 'complete') return run(() => api(`/kerja/api/ops/tasks/${id}`, 'PUT', { status: 'COMPLETED' }), 'Task selesai');
    if (a === 'status') { const s = $('#stSel', b).value; const reason = ['BLOCKED', 'CANCELLED'].includes(s) ? prompt('Alasan / kendala?') : ''; if (reason === null) return; return run(() => api(`/kerja/api/ops/tasks/${id}`, 'PUT', { status: s, reason }), 'Status disimpan'); }
    if (a === 'plan') { const reason = prompt('Alasan perubahan?'); if (reason === null) return; return run(() => api(`/kerja/api/ops/tasks/${id}`, 'PUT', { priority: $('#prSel', b).value, deadline: $('#dlSel', b).value, reason }), 'Rencana disimpan'); }
  }; });
  const rf = $('#rev', b);
  if (rf) rf.onsubmit = (e) => { e.preventDefault(); const r = e.submitter.value; const checked = [...rf.querySelectorAll('[name=checked]:checked')].map((i) => i.value); run(() => api(`/kerja/api/ops/tasks/${id}/review`, 'POST', { stage, result: r, note: rf.note.value, cause: rf.cause.value, checked, subtasks: rf.subtasks.value.split(',').map((x) => x.trim()).filter(Boolean) }), r === 'lolos' ? 'Disetujui' : `Review: ${r}`); };
}

// ---------- 5. Approval & QC
function renderQC(m, tasks) {
  const q = (s) => tasks.filter((t) => t.status === s);
  const hist = tasks.flatMap((t) => t.reviews.map((r) => ({ ...r, id: t.id, title: t.title }))).sort((a, b) => b.at.localeCompare(a.at));
  m.innerHTML = `${topbar('Approval & QC')}<div class="page"><h1 class="ttl">Approval & QC</h1><p class="sub">Hasil kerja diperiksa berjenjang: kepala sub divisi, kepala divisi, lalu Anda.</p>
  <h2 class="h">Menunggu keputusan Anda <span class="n">${q('CEO REVIEW').length}</span></h2>${taskTable(q('CEO REVIEW'), ['pic', 'pri', 'prog'])}
  <h2 class="h">Division Review <span class="n">${q('DIVISION REVIEW').length}</span></h2>${taskTable(q('DIVISION REVIEW'), ['pic', 'pri', 'prog'])}
  <h2 class="h">Subdivision Review <span class="n">${q('INTERNAL REVIEW').length}</span></h2>${taskTable(q('INTERNAL REVIEW'), ['pic', 'pri', 'prog'])}
  <h2 class="h">Sedang direvisi <span class="n">${q('REVISION').length}</span></h2>${taskTable(q('REVISION'), ['pic', 'pri', 'prog'])}
  <h2 class="h">Riwayat keputusan</h2>${hist.length ? `<div class="tw"><table class="db"><tr><th>Task</th><th>Tahap</th><th>Reviewer</th><th>Hasil</th><th>Catatan</th><th>Waktu</th></tr>${hist.map((r) => `<tr class="rowlink" data-open="${r.id}"><td><span class="id">${r.id}</span> ${esc(r.title)}</td><td>${META.stages[r.stage]}</td><td>${esc(r.reviewer)}</td><td>${tag(r.result)}</td><td class="small prose">${esc(r.note)}</td><td class="small muted">${fmtDT(r.at)}</td></tr>`).join('')}</table></div>` : '<p class="empty">Belum ada.</p>'}
  <details style="margin-top:24px"><summary>Checklist kualitas tiap tahap</summary><div class="grid2">${Object.entries({ self: 'Self review (agent)', ...META.stages }).map(([k, n]) => `<div><p style="margin:10px 0 4px;font-weight:600">${n}</p>${META.checklists[k].map((x) => `<div class="small muted">☐ ${esc(x)}</div>`).join('')}</div>`).join('')}</div></details></div>`;
}

// ---------- 6. Analytics
function renderAnalytics(m, a) {
  const r = a.rate;
  const tbl = (rows, cols) => rows.length ? `<div class="tw"><table class="db"><tr>${cols.map(([h, , n]) => `<th class="${n ? 'n' : ''}">${h}</th>`).join('')}</tr>${rows.map((x) => `<tr>${cols.map(([, f, n]) => `<td class="${n ? 'n' : ''}">${f(x)}</td>`).join('')}</tr>`).join('')}</table></div>` : '<p class="empty">Belum ada data. Terisi otomatis dari task, subtask, dan review.</p>';
  const catTag = (c) => tag(c, { Excellent: 'green', 'Very Good': 'green', Good: 'blue', 'Needs Improvement': 'orange', Poor: 'red' }[c] || 'gray');
  m.innerHTML = `${topbar('Analytics')}<div class="page"><h1 class="ttl">Analytics</h1><p class="sub">Dihitung dari task, subtask, dan riwayat review — bukan perkiraan.</p>
  <div class="facts">${[['penyelesaian task', pctTxt(r.completion)], ['tepat deadline', pctTxt(r.deadline)], ['task kena revisi', pctTxt(r.revision)], ['lolos tanpa revisi', pctTxt(r.first_pass)], ['total revisi', r.revisions_total]].map(([k, x]) => `<div class="fact"><b>${x}</b><span>${k}</span></div>`).join('')}</div>
  <h2 class="h">Agent</h2>${tbl(a.agents, [['Agent', (x) => `<div class="row" style="gap:8px;flex-wrap:nowrap">${av(x.agent)}<span class="tt">${esc(x.agent)}</span></div>`], ['Subtask', (x) => x.assigned, 1], ['Selesai', (x) => x.done, 1], ['Tepat waktu', (x) => pctTxt(x.timeliness), 1], ['Revisi', (x) => x.revisions, 1], ['Skor', (x) => `<b>${x.score}</b>`, 1], ['Kategori', (x) => catTag(x.category)]])}
  <p class="small muted">Bobot skor: ${Object.entries(a.weights).map(([k, w]) => `${k} ${w}%`).join(' · ')}. Communication belum terukur otomatis dan dihitung penuh untuk semua agent.</p>
  <h2 class="h">Sub divisi</h2>${tbl(a.subdivisions, [['Sub divisi', (x) => `<span class="tt">${esc(x.name)}</span>`], ['Task', (x) => x.total, 1], ['Selesai', (x) => x.done, 1], ['Tepat waktu', (x) => pctTxt(x.deadline), 1], ['Progres', (x) => prog(x.avg_progress)], ['Revisi / task', (x) => x.revision_rate, 1]])}
  <h2 class="h">Kepala divisi</h2>${tbl(a.heads, [['Divisi', (x) => `<span class="tt">${esc(x.name)}</span>`], ['Kepala', (x) => esc(x.head)], ['Task', (x) => x.total, 1], ['Penyelesaian', (x) => pctTxt(x.completion), 1], ['Tepat waktu', (x) => pctTxt(x.deadline), 1], ['Revisi / task', (x) => x.revision_rate, 1]])}</div>`;
}

// ---------- tautan global
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); openTask(o.dataset.open).catch((err) => toast(err.message)); return; }
  const c = e.target.closest('[data-chat]');
  if (c) { e.preventDefault(); closePeek(); openRoom(c.dataset.chat); }
});

(async () => {
  const h = location.hash.slice(1);
  if (['command', 'tasks', 'qc', 'analytics', 'org', 'chat'].includes(h)) view = h;
  [META, ORGC] = await Promise.all([api('/kerja/api/ops/meta'), api('/kerja/api/ops/org')]);
  $('#who').textContent = `Masuk sebagai ${META.ceo}`;
  render();
  // obrolan dicek tiap 4 detik; halaman lain tiap 20 detik (tidak saat mengetik)
  setInterval(() => { if (view === 'chat' && renderChat.poll) renderChat.poll().catch(() => {}); }, 4000);
  setInterval(() => { if (view !== 'chat' && !$('#peek').classList.contains('open') && !document.activeElement?.closest('form')) render(); else if (view === 'chat') refreshRooms().catch(() => {}); }, 20000);
})();
</script>
</body>
