<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Kantor Agent · {{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='34' rx='5' fill='%236a55c9'/%3E%3Crect x='14' y='20' width='36' height='22' rx='3' fill='%23fff'/%3E%3Crect x='26' y='48' width='12' height='6' fill='%236f6a62'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #efeae3;
  --panel: rgba(255, 255, 255, .9);
  --line: #e6dfd5;
  --line-strong: #d6cdc0;
  --text: #2b2a28;
  --muted: #6f6a62;
  --faint: #8f887e;
  --ok: #23874f;
  --work: #1f9d57;
  --done: #0f7f8f;
  --idle: #8a8378;
  --bad: #c43d3d;
  --radius: 14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; }
.labels { position: fixed; inset: 0; pointer-events: none; }
button { font: inherit; color: inherit; }
.card-ui { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(60, 45, 25, .08); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* bar atas */
.top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: stretch; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.brand { flex: 1; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; padding: 0; overflow: hidden; flex: none; }
.stat { padding: 9px 16px; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.stat b { font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .live { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1.2 var(--sans); white-space: nowrap; }
.stat a { color: #4b3fb0; font-weight: 600; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--work); flex: none; animation: blink 2s infinite; }
.dot.off { background: var(--bad); animation: none; }
@keyframes blink { 50% { opacity: .35; } }
.toggle { padding: 0 14px; border: 1px solid var(--line); cursor: pointer; font-weight: 600; font-size: 12px; white-space: nowrap; }
.toggle:hover { background: #fff; }

.banner { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: 12.5px; display: none; max-width: calc(100vw - 32px); background: #fff4d6; border: 1px solid #f0d58a; color: #6b4d00; box-shadow: 0 6px 20px rgba(60,45,25,.12); text-align: center; }
.banner.show { display: block; }

/* panel samping */
.side { position: fixed; top: 84px; bottom: 150px; width: 312px; display: flex; flex-direction: column; overflow: hidden; z-index: 4; }
.side.left { left: 16px; }
.side.right { right: 16px; width: 336px; }
.side header { padding: 10px 12px 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
.side header h2 { margin: 0; font-size: 12.5px; font-weight: 700; }
.hright { display: flex; align-items: center; gap: 6px; }
.scroll { overflow-y: auto; overflow-x: hidden; flex: 1; scrollbar-width: thin; scrollbar-color: #d6cdc0 transparent; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; background: #fff; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.minbtn { flex: none; display: grid; place-items: center; width: 32px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; color: var(--muted); }
.minbtn:hover { color: var(--text); border-color: var(--line-strong); }
.minbtn svg { transition: transform .2s; }
.side.min { bottom: auto !important; height: auto !important; }
.side.min .scroll { display: none; }
.side.min header, .side.min .tabrow { border-bottom: 0; }
.side.min .minbtn svg { transform: rotate(180deg); }
.side.min .tabs button[aria-selected="true"] { border-bottom-color: transparent; }

.feed { list-style: none; margin: 0; padding: 6px 0; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; padding: 6px 14px; }
.feed li.fresh { animation: in .6s ease both; background: #fbf6ec; }
.feed .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11.5px; }
.feed .meta { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.feed .who { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed time { font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.feed .txt { color: #3d3a36; overflow-wrap: anywhere; }
.feed li.k-text .txt { color: var(--muted); font-style: italic; }
.feed li.k-assign .txt { font-weight: 600; }
.feed li.k-done .txt::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.feed li.k-resume .txt::before { content: "↻ "; color: var(--done); font-weight: 700; }
@keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.tabrow { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding-right: 8px; }
.tabs { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; background: none; border: 0; padding: 9px 4px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs button .n { display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: #eee7dc; font-size: 10.5px; line-height: 16px; color: var(--muted); }
.pane { display: none; padding: 10px 12px 14px; }
.pane.on { display: block; }
.pane[data-pane="feed2"] { padding: 0; }
.empty { color: var(--faint); padding: 18px 6px; text-align: center; font-size: 12.5px; }
.src { margin: 2px 2px 10px; font-size: 11.5px; color: var(--muted); }
.run { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 8px; border-radius: 9px; align-items: baseline; }
.run:hover { background: #faf6ef; }
.run .c { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.run .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .w { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; padding: 4px 8px; font-size: 12.5px; }
.todo i { font-style: normal; color: var(--faint); }
.todo.s-in_progress i { color: var(--ok); }
.todo.s-completed span { color: var(--faint); text-decoration: line-through; }

/* kartu karakter */
.cards { position: fixed; left: 16px; right: 16px; bottom: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; z-index: 5; }
.card { padding: 10px 12px 11px; cursor: pointer; transition: transform .25s, box-shadow .25s; min-width: 0; text-align: left; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 2px 10px; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(60,45,25,.14); }
.card:focus-visible { outline: 2px solid #4b3fb0; outline-offset: 2px; }
.card .ava { grid-row: 1 / span 3; width: 38px; height: 38px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; position: relative; }
.card.working .ava::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: #2fbf71; border: 2px solid #fff; }
.card .h { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; row-gap: 2px; }
.card .nm { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card .role { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.card .st { margin-left: auto; }
.card .task { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .act { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.more { cursor: default; --c: #8a8378; }
.card.more:hover { transform: none; }
.cards.compact .card { padding: 8px 9px 9px; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 8px; }
.cards.compact .card .ava { width: 30px; height: 30px; font-size: 12.5px; }
.cards.compact .card .role { display: none; }
.cards.compact .card.fl .role { display: inline; }
.cards.compact .card .st { margin-left: 0; font-size: 10px; padding: 1px 6px; }

/* label 3D: nama + gelembung */
.person { transform: translateY(-4px); text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.person.out { display: none; }
.bubble { max-width: 220px; padding: 6px 10px; border-radius: 12px; background: #fff; color: #2b2a28; font-size: 11.5px; line-height: 1.35; box-shadow: 0 4px 14px rgba(60,45,25,.18); position: relative; border: 1px solid #eadfce; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: #fff; border-right: 1px solid #eadfce; border-bottom: 1px solid #eadfce; transform: translateX(-50%) rotate(45deg); }
.bubble.hide { display: none; }
.bubble.hi { background: #e9f8ef; border-color: #b6e3c6; font-weight: 600; } .bubble.hi::after { background: #e9f8ef; border-color: #b6e3c6; }
.tag { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.18); white-space: nowrap; }
.tag small { font-weight: 500; opacity: .9; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); transition: opacity .8s; }
.loading.gone { opacity: 0; pointer-events: none; }
.loading div { text-align: center; color: var(--muted); font-size: 13px; }
.loading i { display: block; width: 160px; height: 3px; margin: 12px auto 0; border-radius: 99px; background: linear-gradient(90deg, transparent, #6a55c9, transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: load 1.2s linear infinite; }
@keyframes load { from { background-position: -100% 0; } to { background-position: 200% 0; } }
.nogl { position: fixed; inset: 0; display: none; place-items: center; z-index: 1; color: var(--muted); padding: 24px; text-align: center; }
body.nogl-on .nogl { display: grid; }

body.lapang .side { display: none; }
body.lapang .cards { opacity: .92; }
@media (max-width: 1180px) {
  .side.left { display: none; }
}
@media (max-width: 820px) {
  .top { flex-wrap: wrap; top: 10px; left: 10px; right: 10px; gap: 8px; }
  .brand { flex: 1 1 100%; }
  .brand p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stats { flex: 1 1 100%; }
  .stat { flex: 1 1 0; padding: 7px 12px; }
  .stat b { font-size: 14px; }
  .toggle { display: none; }
  .banner { top: auto; bottom: 46vh; }
  .side.right { top: auto; left: 10px; right: 10px; width: auto; bottom: 10px; height: 38vh; }
  .side.right.min { top: auto; bottom: 10px !important; }
  body.min-right .cards { bottom: 70px; }
  body.min-right .banner { bottom: 150px; }
  .card-ui { background: rgba(255, 255, 255, .62); backdrop-filter: blur(6px) saturate(120%); -webkit-backdrop-filter: blur(6px) saturate(120%); box-shadow: 0 4px 16px rgba(60, 45, 25, .08); }
  .cards { bottom: calc(38vh + 18px); left: 0; right: 0; display: flex; overflow-x: auto; gap: 8px; padding: 0 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 72%; scroll-snap-align: start; padding: 8px 10px; }
  .cards.compact .card { flex-basis: 64%; }
  .bubble { max-width: 150px; font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/kerja/assets/vendor/three/build/three.module.js",
  "three/addons/": "/kerja/assets/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="loading" id="loading"><div>Menyiapkan kantor…<i></i></div></div>
<div id="scene" aria-hidden="true"></div>
<div class="labels" id="labels" aria-hidden="true"></div>
<div class="nogl">Browser ini tidak mendukung WebGL, jadi kantor 3D tidak bisa ditampilkan. Panel aktivitas tetap berjalan.</div>

<div class="top">
  <div class="brand card-ui">
    <h1>Kantor Agent <span>· {{TITLE}}</span></h1>
    <p id="phase" aria-live="polite">Memuat…</p>
  </div>
  <div class="stats card-ui">
    <div class="stat"><small>Status</small><span class="live"><i class="dot" id="liveDot"></i><span id="liveTxt">Menghubungkan…</span></span></div>
    <div class="stat"><small>Subagent hari ini</small><b id="sToday">–</b></div>
    <div class="stat"><small>Aktif sekarang</small><b id="sActive">–</b></div>
    <div class="stat" id="pubStat" hidden><small>URL publik</small><a id="pubLink" href="#" target="_blank" rel="noopener noreferrer">buka</a></div>
  </div>
  <button class="toggle card-ui" id="togglePanel" type="button" title="Tombol pintas: H">Lihat kantor penuh</button>
</div>

<div class="banner" id="banner" role="status"></div>

<aside class="side left card-ui" aria-label="Aktivitas langsung">
  <header><h2>Aktivitas langsung</h2><span class="hright"><span class="chip" id="feedCount">0</span><button type="button" class="minbtn" data-min="left" aria-expanded="true" title="Perkecil / buka panel"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr">Perkecil panel</span></button></span></header>
  <div class="scroll"><ul class="feed" id="feed"></ul></div>
</aside>

<aside class="side right card-ui" aria-label="Riwayat dan daftar tugas">
  <div class="tabrow"><div class="tabs" role="tablist">
    <button role="tab" data-tab="riwayat" aria-selected="true">Riwayat<span class="n" id="nRuns">0</span></button>
    <button role="tab" data-tab="tugas" aria-selected="false">Tugas <span id="tugasWho">Ketua</span><span class="n" id="nTodo">0</span></button>
    <button role="tab" data-tab="feed2" aria-selected="false" class="mfeed" hidden>Aktivitas</button>
  </div><button type="button" class="minbtn" data-min="right" aria-expanded="true" title="Perkecil / buka panel"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr">Perkecil panel</span></button></div>
  <div class="scroll">
    <section class="pane on" data-pane="riwayat" id="paneRuns"></section>
    <section class="pane" data-pane="tugas" id="paneTodo"></section>
    <section class="pane" data-pane="feed2"><ul class="feed" id="feed2"></ul></section>
  </div>
</aside>

<div class="cards" id="cards" aria-label="Karakter"></div>

{{CONFIG_SCRIPT}}
<script type="module" src="/kerja/assets/kantor.js?v=100"></script>
</body>
</html>
